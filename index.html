<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NYC MARATHON — 18 Week Block</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise" aria-hidden="true"></div>

  <main class="page">
    <div class="hero-sticky" id="heroSticky">
      <header class="page-header">
        <p class="eyebrow">18-Week Block <span class="dot">●</span> Distance</p>
        <h1 class="title">NYC<span class="title-accent">MARATHON</span></h1>
        <p class="tagline">Race day — Sun 11.01.2026</p>
        <div class="hairline" aria-hidden="true"></div>
      </header>

      <div id="stats" class="stats"></div>

      <div class="toolbar">
        <span id="saveStatus" class="save-status" aria-live="polite"></span>
        <div class="backup-actions">
          <button type="button" id="exportBtn" class="tool-btn">Export Backup</button>
          <button type="button" id="importBtn" class="tool-btn">Import Backup</button>
          <input type="file" id="importFile" accept="application/json" hidden />
        </div>
      </div>
    </div>

    <div id="calendar" class="calendar"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
